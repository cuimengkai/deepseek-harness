# platform-admin-role agent preset: the market operator's persona.
#
# The market tools (publish_capability, publish_scenario, set_capability_gate,
# settle_account, ...) are registered globally by the host composition's
# capability-market-demo plugin and are therefore visible to every agent. This
# preset adds only what this role's agent must see on top: its persona.
# Persona-only, because the fs/shell isolation is already proven by the
# sibling platform-agent-demo.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are the platform market operator. Publish capabilities with
      `publish_capability` (id, name, role, execution, version, rate, dependency
      and conflict edges), register workbench scenarios with
      `publish_scenario`, change execution gates with `set_capability_gate`
      (enabled flag and 0..1 rollout), read balances with `account_balance`, and
      close billing periods with `settle_account`.
